openapi: "3.0.4"
info:
  title: "FatiHomes API"
  description: "REST API for eighteen stays across Kosovo, Albania and the coast. Quote and create share one pricing calculator, every error uses one envelope, and the catalogue is EUR only."
  contact:
    name: "FatiHomes"
    url: "https://fatihomes.example.com"
    email: "hello@fatihomes.example"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
  version: "2.0.0"
paths:
  /v1/favorites:
    get:
      tags:
        - "Favorites"
      summary: "Saved stays as full listings, ordered by title."
      responses:
        200:
          description: "The saved stays."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ListingDetail"
  /v1/favorites/{listingId}:
    post:
      tags:
        - "Favorites"
      summary: "Toggles one stay. Adding and removing both return 200 with the new state."
      parameters:
        -
          name: "listingId"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "The new state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteToggleResponse"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/hosts:
    get:
      tags:
        - "Hosts"
      summary: "All hosts, sorted by name, with weighted ratings and property counts."
      responses:
        200:
          description: "The host directory."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/HostProfileResponse"
  /v1/hosts/{id}:
    get:
      tags:
        - "Hosts"
      summary: "One host profile."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Host GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "The host."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostProfileResponse"
        404:
          description: "No host has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/hosts/{id}/listings:
    get:
      tags:
        - "Hosts"
      summary: "Every stay managed by a host. An empty array is valid for a host with no stays."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Host GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "The host's stays."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ListingDetail"
        404:
          description: "No host has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/hosts/{id}/verification:
    get:
      tags:
        - "Hosts"
      summary: "Stored verification flags, read from the host record rather than inferred."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Host GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "Verification flags and the host's review aggregate."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostVerificationDetail"
        404:
          description: "No host has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/listings:
    get:
      tags:
        - "Listings"
      summary: "Lists stays without filtering. Use the search endpoint for anything else."
      parameters:
        -
          name: "limit"
          in: "query"
          description: "Maximum number of stays, clamped to 1 through 100. Defaults to 50."
          schema:
            type: "integer"
            format: "int32"
            default: 50
      responses:
        200:
          description: "The stays, newest first."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ListingDetail"
    post:
      tags:
        - "Listings"
      summary: "Creates a stay. The host is looked up by `hostId`; a caller cannot supply host details."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        201:
          description: "The created stay, with a Location header."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        400:
          description: "Model binding or DataAnnotations failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Semantic validation failure, for example an unknown category or host."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/listings/search:
    post:
      tags:
        - "Listings"
      summary: |-
        Searches stays by text, dates, guests, pets, price, rooms, amenities, rating, neighbourhood,
        host, circle or polygon, with sorting and pagination. Both dates or neither.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingSearchRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/ListingSearchRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/ListingSearchRequest"
      responses:
        200:
          description: "A page of results plus `appliedFilters`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingSearchResponse"
        422:
          description: "Invalid dates, sort, category, price, geo filter or paging."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/listings/{id}:
    get:
      tags:
        - "Listings"
      summary: "Reads one stay by id."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "The stay."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
        - "Listings"
      summary: "Partially updates a stay. Null properties keep their stored value."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        description: "Fields to change."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
      responses:
        200:
          description: "The updated stay."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        400:
          description: "Model binding or DataAnnotations failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Semantic validation failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - "Listings"
      summary: |-
        Deletes a stay. Blocked with 409 while an active reservation exists. Otherwise the stay, its
        reviews, its favorite entry and any finished reservations are removed.
      parameters:
        -
          name: "id"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        204:
          description: "Deleted."
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        409:
          description: "The stay has active reservations."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/listings/{id}/availability:
    get:
      tags:
        - "Listings"
      summary: |-
        Day-by-day availability. Both dates are required, the window is capped at 92 days, past days
        are marked with `blockReason: "past"` and booked days with `"booked"`.
      parameters:
        -
          name: "id"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "start_date"
          in: "query"
          description: "First day, `YYYY-MM-DD`."
          schema:
            type: "string"
            format: "date"
        -
          name: "end_date"
          in: "query"
          description: "Last day, inclusive."
          schema:
            type: "string"
            format: "date"
      responses:
        200:
          description: "The calendar window."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingAvailabilityResponse"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Missing dates, reversed range or a window over 92 days."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/listings/{id}/reviews:
    get:
      tags:
        - "Listings"
      summary: "Reviews for a stay, newest first, with the stored average and count."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "page"
          in: "query"
          description: "Page number, defaults to 1."
          schema:
            type: "integer"
            format: "int32"
            default: 1
        -
          name: "pageSize"
          in: "query"
          description: "Page size, clamped to 1 through 50."
          schema:
            type: "integer"
            format: "int32"
            default: 10
      responses:
        200:
          description: "The reviews page."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsResponse"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - "Listings"
      summary: |-
        Adds a review and recomputes the stay rating and review count from the real records.
        Writes are limited to 5 per minute per IP.
      parameters:
        -
          name: "id"
          in: "path"
          description: "Listing GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        description: "Rating 1 to 5, comment 20 to 1200 characters, name 2 to 80."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        201:
          description: "The created review."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        400:
          description: "Rating, comment or name failed validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        429:
          description: "More than 5 review writes in a minute from this IP."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/reservations:
    get:
      tags:
        - "Reservations"
      summary: "Lists reservations, newest first, optionally filtered by status."
      parameters:
        -
          name: "status"
          in: "query"
          description: "One of pending_approval, confirmed, checked_in, completed, cancelled."
          schema:
            type: "string"
      responses:
        200:
          description: "Reservations."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Reservation"
        422:
          description: "Unknown status filter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - "Reservations"
      summary: |-
        Creates a reservation. Past check-in, minimum stay, capacity, booking flow and overlaps are
        enforced, and the stored total is the same number the quote endpoint returns.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        201:
          description: "The reservation, with a Location header."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        400:
          description: "Model binding or DataAnnotations failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        409:
          description: "The dates overlap an active reservation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Semantic validation failure."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/reservations/quote:
    post:
      tags:
        - "Reservations"
      summary: |-
        Prices a stay without booking it. Returns 200 with `isAvailable: false` and a reason when
        the dates overlap an active reservation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        200:
          description: "The quote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationQuote"
        404:
          description: "No stay has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Missing or reversed dates, too short or too long a stay, too many guests."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/reservations/{id}:
    get:
      tags:
        - "Reservations"
      summary: "Reads one reservation, including its price breakdown."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Reservation GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "The reservation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        404:
          description: "No reservation has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/reservations/{id}/status:
    patch:
      tags:
        - "Reservations"
      summary: |-
        Moves a reservation through its state machine. Only the transitions listed in the README are
        allowed, and check-in and completion respect the arrival and departure dates.
      parameters:
        -
          name: "id"
          in: "path"
          description: "Reservation GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        description: "Target status and an optional reason."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationStatusRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationStatusRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/UpdateReservationStatusRequest"
      responses:
        200:
          description: "The updated reservation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        404:
          description: "No reservation has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        409:
          description: "Illegal transition, with `details.allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Unknown status or an over-long reason."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/reservations/{id}/cancel:
    post:
      tags:
        - "Reservations"
      summary: "Cancels a booking that has not started. Past, completed or cancelled bookings return 409."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Reservation GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "reason"
          in: "query"
          description: "Optional cancellation reason, at most 240 characters."
          schema:
            type: "string"
      responses:
        200:
          description: "The cancelled reservation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        404:
          description: "No reservation has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        409:
          description: "Cancellation is no longer allowed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Unprocessable Content"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/reservations/{id}/messages:
    get:
      tags:
        - "Reservations"
      summary: "Reads the message thread for a reservation, oldest first."
      parameters:
        -
          name: "id"
          in: "path"
          description: "Reservation GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        200:
          description: "Messages."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Message"
        404:
          description: "No reservation has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - "Reservations"
      summary: |-
        Sends a message to the thread. The sender id is derived from the participant role, so a client
        cannot post as an arbitrary user.
      parameters:
        -
          name: "id"
          in: "path"
          description: "Reservation GUID."
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        description: "Role, body and an optional sender id that must be a participant."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
          "application/*+json":
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        201:
          description: "The created message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        400:
          description: "Empty or over-long body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        404:
          description: "No reservation has that id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        422:
          description: "Unknown role or a sender that is not a participant."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/system/health:
    get:
      tags:
        - "System"
      summary: |-
        Health check with a real store probe, the assembly version, uptime in seconds and the
        environment name. The response is never cached.
      responses:
        200:
          description: "Status, checks, version, uptime and environment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/system/stats:
    get:
      tags:
        - "System"
      summary: "Platform counters, the assembly version, uptime and paid totals grouped by currency."
      responses:
        200:
          description: "The counters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatsResponse"
  /v1/system/stage:
    get:
      tags:
        - "System"
      summary: "The configured stage name and the ASP.NET Core environment."
      responses:
        200:
          description: "Stage, environment, version and timestamp."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResponse"
  /v1/system/reset:
    post:
      tags:
        - "System"
      summary: |-
        Restores the seeded catalogue. Available in Development, or when
        `DemoMode:ResetOnStart` is true; otherwise the route pretends not to exist.
      responses:
        200:
          description: "The reset succeeded and the new counts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        404:
          description: "Reset is disabled in this environment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    Address:
      type: "object"
      properties:
        street:
          type: "string"
          nullable: true
        city:
          type: "string"
          nullable: true
        state:
          type: "string"
          nullable: true
        postalCode:
          type: "string"
          nullable: true
        countryCode:
          type: "string"
          nullable: true
        neighborhoodId:
          type: "string"
          nullable: true
      additionalProperties: false
      description: "A postal address plus the neighbourhood identifier used by search."
    ApiError:
      type: "object"
      properties:
        code:
          type: "string"
          description: "Stable machine-readable error code, for example `VALIDATION_FAILED`."
          nullable: true
        message:
          type: "string"
          description: "Short sentence that is safe to show to a user."
          nullable: true
        traceId:
          type: "string"
          description: "Correlation id taken from `HttpContext.TraceIdentifier`."
          nullable: true
        fieldErrors:
          type: "object"
          additionalProperties:
            type: "array"
            items:
              type: "string"
          description: "Field level errors keyed by the camelCase JSON field name."
          nullable: true
        details:
          description: "Optional structured context, for example the conflicting dates."
          nullable: true
      additionalProperties: false
      description: "The single error envelope returned by every 4xx and 5xx response."
    AppliedFilters:
      type: "object"
      properties:
        query:
          type: "string"
          nullable: true
        checkInDate:
          type: "string"
          format: "date"
          nullable: true
        checkOutDate:
          type: "string"
          format: "date"
          nullable: true
        guestsCount:
          type: "integer"
          format: "int32"
        petsCount:
          type: "integer"
          format: "int32"
        minPrice:
          type: "number"
          format: "double"
          nullable: true
        maxPrice:
          type: "number"
          format: "double"
          nullable: true
        minRating:
          type: "number"
          format: "double"
          nullable: true
        minBedrooms:
          type: "integer"
          format: "int32"
          nullable: true
        minBeds:
          type: "integer"
          format: "int32"
          nullable: true
        minBathrooms:
          type: "number"
          format: "double"
          nullable: true
        superhostOnly:
          type: "boolean"
        instantBookOnly:
          type: "boolean"
        neighborhoodId:
          type: "string"
          nullable: true
        hostId:
          type: "string"
          format: "uuid"
          nullable: true
        categories:
          type: "array"
          items:
            type: "string"
          nullable: true
        requiredAmenities:
          type: "array"
          items:
            type: "string"
          nullable: true
        hasCircle:
          type: "boolean"
        hasPolygon:
          type: "boolean"
        sortBy:
          type: "string"
          nullable: true
      additionalProperties: false
      description: |-
        The normalised filters the server actually applied. The web client renders chips from this
        instead of guessing which fields were used.
    CapacityBreakdown:
      type: "object"
      properties:
        maxGuests:
          type: "integer"
          format: "int32"
        bedrooms:
          type: "integer"
          format: "int32"
        beds:
          type: "integer"
          format: "int32"
        bathrooms:
          type: "number"
          format: "double"
      additionalProperties: false
      description: "How many people a stay sleeps and how many rooms it has."
    CoordinatePair:
      type: "object"
      properties:
        latitude:
          type: "number"
          format: "double"
        longitude:
          type: "number"
          format: "double"
      additionalProperties: false
      description: "A WGS84 coordinate pair used for the map-oriented search filters."
    CreateListingRequest:
      required:
        - "address"
        - "capacity"
        - "category"
        - "coordinates"
        - "description"
        - "hostId"
        - "houseRules"
        - "pricing"
        - "title"
      type: "object"
      properties:
        title:
          maxLength: 120
          minLength: 5
          type: "string"
        description:
          maxLength: 2000
          minLength: 20
          type: "string"
        imageUrl:
          maxLength: 300
          type: "string"
          description: "Optional same-origin image path, for example `/images/stays/pristina-loft-1200.webp`."
          nullable: true
        category:
          minLength: 1
          type: "string"
        coordinates:
          $ref: "#/components/schemas/CoordinatePair"
        address:
          $ref: "#/components/schemas/Address"
        capacity:
          $ref: "#/components/schemas/CapacityBreakdown"
        amenities:
          type: "array"
          items:
            type: "string"
          nullable: true
        hostId:
          type: "string"
          format: "uuid"
        pricing:
          $ref: "#/components/schemas/PricingMatrix"
        houseRules:
          $ref: "#/components/schemas/HouseRules"
        instantBookEnabled:
          type: "boolean"
      additionalProperties: false
      description: |-
        Create request. The host is referenced by id, never supplied as a nested object, so a caller
        cannot impersonate a host.
    CreateMessageRequest:
      required:
        - "messageBody"
        - "senderRole"
      type: "object"
      properties:
        senderId:
          type: "string"
          description: "Optional. When omitted the server derives the sender from the role and the reservation."
          format: "uuid"
          nullable: true
        senderRole:
          maxLength: 20
          minLength: 0
          type: "string"
        messageBody:
          maxLength: 2000
          minLength: 1
          type: "string"
      additionalProperties: false
    CreateReservationRequest:
      required:
        - "primaryGuest"
      type: "object"
      properties:
        listingId:
          type: "string"
          format: "uuid"
        checkInDate:
          type: "string"
          format: "date"
          nullable: true
        checkOutDate:
          type: "string"
          format: "date"
          nullable: true
        guestsCount:
          maximum: 20
          minimum: 1
          type: "integer"
          format: "int32"
        primaryGuest:
          $ref: "#/components/schemas/PrimaryGuest"
        paymentAuthorizationToken:
          maxLength: 128
          minLength: 0
          type: "string"
          description: "Simulated payment token. It is checked for length, then discarded and never logged."
          nullable: true
        bookingFlow:
          maxLength: 30
          minLength: 0
          type: "string"
          description: "Either `instant_book` or `request_to_book`."
          nullable: true
        specialRequests:
          maxLength: 500
          minLength: 0
          type: "string"
          nullable: true
      additionalProperties: false
    CreateReviewRequest:
      required:
        - "authorName"
        - "comment"
      type: "object"
      properties:
        authorName:
          maxLength: 80
          minLength: 2
          type: "string"
        authorAvatarUrl:
          maxLength: 300
          type: "string"
          nullable: true
        rating:
          maximum: 5
          minimum: 1
          type: "integer"
          format: "int32"
        comment:
          maxLength: 1200
          minLength: 20
          type: "string"
      additionalProperties: false
    DailyAvailability:
      type: "object"
      properties:
        date:
          type: "string"
          format: "date"
        isAvailable:
          type: "boolean"
        nightlyPrice:
          type: "number"
          format: "double"
        minimumStayNights:
          type: "integer"
          format: "int32"
        blockReason:
          type: "string"
          nullable: true
      additionalProperties: false
      description: |-
        One day in the availability calendar. `BlockReason` is one of `available`, `booked`
        or `past`.
    DynamicDiscounts:
      type: "object"
      properties:
        weeklyDiscountPercent:
          type: "number"
          format: "double"
        monthlyDiscountPercent:
          type: "number"
          format: "double"
      additionalProperties: false
      description: "Length-of-stay discounts. Percentages are 0 to 100."
    FavoriteToggleResponse:
      type: "object"
      properties:
        listingId:
          type: "string"
          format: "uuid"
        favorited:
          type: "boolean"
      additionalProperties: false
    GeoCircleSearch:
      type: "object"
      properties:
        center:
          $ref: "#/components/schemas/CoordinatePair"
        radiusMeters:
          type: "integer"
          format: "int32"
      additionalProperties: false
      description: "Circular geographic filter. Radius is validated between 100 and 100000 metres."
    GeoPolygonSearch:
      type: "object"
      properties:
        boundaryPoints:
          type: "array"
          items:
            $ref: "#/components/schemas/CoordinatePair"
          nullable: true
      additionalProperties: false
      description: "Polygon geographic filter. At least three boundary points are required."
    HealthResponse:
      type: "object"
      properties:
        status:
          type: "string"
          nullable: true
        checks:
          type: "object"
          additionalProperties:
            type: "string"
          nullable: true
        version:
          type: "string"
          nullable: true
        uptimeSeconds:
          type: "integer"
          format: "int32"
        environment:
          type: "string"
          nullable: true
      additionalProperties: false
    HostDetails:
      type: "object"
      properties:
        hostId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          nullable: true
        profilePhotoUrl:
          type: "string"
          nullable: true
        responseRate:
          type: "number"
          format: "double"
        responseTimeMinutes:
          type: "integer"
          format: "int32"
        superhostStatus:
          type: "boolean"
        verifiedIdentity:
          type: "boolean"
      additionalProperties: false
      description: "The host data embedded in every listing. The extended host record lives in the host directory."
    HostProfileResponse:
      type: "object"
      properties:
        hostId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          nullable: true
        profilePhotoUrl:
          type: "string"
          nullable: true
        responseRate:
          type: "number"
          format: "double"
        responseTimeMinutes:
          type: "integer"
          format: "int32"
        superhostStatus:
          type: "boolean"
        verifiedIdentity:
          type: "boolean"
        totalProperties:
          type: "integer"
          format: "int32"
        aggregateRating:
          type: "number"
          format: "double"
        totalReviewsReceived:
          type: "integer"
          format: "int32"
        bio:
          type: "string"
          nullable: true
        joinedYear:
          type: "integer"
          format: "int32"
      additionalProperties: false
    HostVerificationDetail:
      type: "object"
      properties:
        hostId:
          type: "string"
          format: "uuid"
        identityStatus:
          type: "string"
          nullable: true
        phoneVerified:
          type: "boolean"
        emailVerified:
          type: "boolean"
        governmentIdVerified:
          type: "boolean"
        backgroundCheckCleared:
          type: "boolean"
        reviewCount:
          type: "integer"
          format: "int32"
        aggregateRating:
          type: "number"
          format: "double"
      additionalProperties: false
    HouseRules:
      type: "object"
      properties:
        quietHoursStart:
          type: "string"
          nullable: true
        quietHoursEnd:
          type: "string"
          nullable: true
        smokingAllowed:
          type: "boolean"
        partiesAllowed:
          type: "boolean"
        maxPets:
          type: "integer"
          format: "int32"
      additionalProperties: false
      description: "House rules shown on the stay detail page and used by the pets filter."
    ListingAvailabilityResponse:
      type: "object"
      properties:
        listingId:
          type: "string"
          format: "uuid"
        startDate:
          type: "string"
          format: "date"
        endDate:
          type: "string"
          format: "date"
        days:
          type: "array"
          items:
            $ref: "#/components/schemas/DailyAvailability"
          nullable: true
      additionalProperties: false
    ListingDetail:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        imageUrl:
          type: "string"
          nullable: true
        category:
          type: "string"
          nullable: true
        coordinates:
          $ref: "#/components/schemas/CoordinatePair"
        address:
          $ref: "#/components/schemas/Address"
        capacity:
          $ref: "#/components/schemas/CapacityBreakdown"
        amenities:
          type: "array"
          items:
            type: "string"
          nullable: true
        host:
          $ref: "#/components/schemas/HostDetails"
        pricing:
          $ref: "#/components/schemas/PricingMatrix"
        houseRules:
          $ref: "#/components/schemas/HouseRules"
        instantBookEnabled:
          type: "boolean"
        starRating:
          type: "number"
          format: "double"
        reviewCount:
          type: "integer"
          format: "int32"
        createdAt:
          type: "string"
          format: "date-time"
      additionalProperties: false
      description: "A stay in the catalogue."
    ListingSearchRequest:
      type: "object"
      properties:
        query:
          type: "string"
          description: "Free text matched against title, description, city, state and category."
          nullable: true
        checkInDate:
          type: "string"
          format: "date"
          nullable: true
        checkOutDate:
          type: "string"
          format: "date"
          nullable: true
        guestsCount:
          type: "integer"
          description: "Number of guests, 1 to 20."
          format: "int32"
        petsCount:
          type: "integer"
          description: "Pets travelling with the guest. Listings with fewer allowed pets are excluded."
          format: "int32"
        minPrice:
          type: "number"
          format: "double"
          nullable: true
        maxPrice:
          type: "number"
          format: "double"
          nullable: true
        categories:
          type: "array"
          items:
            type: "string"
          nullable: true
        requiredAmenities:
          type: "array"
          items:
            type: "string"
          nullable: true
        circleSearch:
          $ref: "#/components/schemas/GeoCircleSearch"
        polygonSearch:
          $ref: "#/components/schemas/GeoPolygonSearch"
        minBedrooms:
          type: "integer"
          format: "int32"
          nullable: true
        minBeds:
          type: "integer"
          format: "int32"
          nullable: true
        minBathrooms:
          type: "number"
          format: "double"
          nullable: true
        superhostOnly:
          type: "boolean"
        instantBookOnly:
          type: "boolean"
        minRating:
          type: "number"
          format: "double"
          nullable: true
        neighborhoodId:
          type: "string"
          description: "Case-insensitive neighbourhood identifier, for example `neigh_oldtown`."
          nullable: true
        hostId:
          type: "string"
          description: "Exact host match, used by the host detail page."
          format: "uuid"
          nullable: true
        sortBy:
          type: "string"
          description: |-
            One of `recommended`, `price_asc`, `price_desc`, `rating_desc`,
            `reviews_desc` or `distance_asc`. `distance_asc` requires a circle.
          nullable: true
        page:
          type: "integer"
          format: "int32"
        pageSize:
          type: "integer"
          format: "int32"
      additionalProperties: false
      description: |-
        Search request. One `guestsCount` replaces the old adults, children and infants fields.
        The catalogue is EUR-only, so the old `currency` field is gone.
    ListingSearchResponse:
      type: "object"
      properties:
        page:
          type: "integer"
          format: "int32"
        pageSize:
          type: "integer"
          format: "int32"
        totalRecords:
          type: "integer"
          format: "int32"
        totalPages:
          type: "integer"
          format: "int32"
        appliedFilters:
          $ref: "#/components/schemas/AppliedFilters"
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/ListingDetail"
          nullable: true
      additionalProperties: false
    Message:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        reservationId:
          type: "string"
          format: "uuid"
        senderId:
          type: "string"
          format: "uuid"
        senderRole:
          type: "string"
          nullable: true
        messageBody:
          type: "string"
          nullable: true
        sentAt:
          type: "string"
          format: "date-time"
        read:
          type: "boolean"
      additionalProperties: false
    PriceBreakdownItem:
      type: "object"
      properties:
        description:
          type: "string"
          nullable: true
        amount:
          type: "number"
          format: "double"
      additionalProperties: false
    PricingMatrix:
      type: "object"
      properties:
        currency:
          type: "string"
          nullable: true
        baseNightlyRate:
          type: "number"
          format: "double"
        cleaningFee:
          type: "number"
          format: "double"
        serviceFee:
          type: "number"
          format: "double"
        localOccupancyTax:
          type: "number"
          format: "double"
        securityDeposit:
          type: "number"
          format: "double"
        discounts:
          $ref: "#/components/schemas/DynamicDiscounts"
        minNights:
          type: "integer"
          format: "int32"
      additionalProperties: false
      description: |-
        The pricing matrix for a stay. All money is EUR and rounded to two decimals.
        Cleaning and service fees are flat per booking, occupancy tax is flat per stay and
        the security deposit is refundable, so it is never part of the total.
    PrimaryGuest:
      required:
        - "email"
        - "firstName"
        - "lastName"
        - "phoneNumber"
      type: "object"
      properties:
        firstName:
          maxLength: 80
          minLength: 2
          type: "string"
        lastName:
          maxLength: 80
          minLength: 2
          type: "string"
        email:
          maxLength: 254
          minLength: 0
          type: "string"
          format: "email"
        phoneNumber:
          maxLength: 20
          minLength: 7
          type: "string"
      additionalProperties: false
      description: |-
        The guest who made the booking. Validated with DataAnnotations, so missing or malformed values
        produce the unified `VALIDATION_FAILED` envelope.
    QuoteRequest:
      type: "object"
      properties:
        listingId:
          type: "string"
          format: "uuid"
        checkInDate:
          type: "string"
          format: "date"
          nullable: true
        checkOutDate:
          type: "string"
          format: "date"
          nullable: true
        guestsCount:
          maximum: 20
          minimum: 1
          type: "integer"
          format: "int32"
      additionalProperties: false
      description: "Quote request. Dates are nullable so a missing date returns a field error instead of 0001-01-01."
    Reservation:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        listingId:
          type: "string"
          format: "uuid"
        hostId:
          type: "string"
          format: "uuid"
        guestId:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          nullable: true
        bookingFlow:
          type: "string"
          nullable: true
        checkInDate:
          type: "string"
          format: "date"
        checkOutDate:
          type: "string"
          format: "date"
        guestsCount:
          type: "integer"
          format: "int32"
        primaryGuest:
          $ref: "#/components/schemas/PrimaryGuest"
        pricingSummary:
          $ref: "#/components/schemas/ReservationPricingSummary"
        specialRequests:
          type: "string"
          nullable: true
        cancellationReason:
          type: "string"
          nullable: true
        cancelledAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      additionalProperties: false
      description: "A booking. `paymentAuthorizationToken` is never stored or returned."
    ReservationPricingSummary:
      type: "object"
      properties:
        currency:
          type: "string"
          nullable: true
        basePrice:
          type: "number"
          format: "double"
        cleaningFee:
          type: "number"
          format: "double"
        serviceFee:
          type: "number"
          format: "double"
        localOccupancyTax:
          type: "number"
          format: "double"
        securityDeposit:
          type: "number"
          format: "double"
        discountAmount:
          type: "number"
          format: "double"
        totalAmount:
          type: "number"
          format: "double"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/PriceBreakdownItem"
          nullable: true
      additionalProperties: false
    ReservationQuote:
      type: "object"
      properties:
        listingId:
          type: "string"
          format: "uuid"
        currency:
          type: "string"
          nullable: true
        nights:
          type: "integer"
          format: "int32"
        nightlyRate:
          type: "number"
          format: "double"
        basePrice:
          type: "number"
          format: "double"
        discountPercent:
          type: "number"
          format: "double"
        discountAmount:
          type: "number"
          format: "double"
        cleaningFee:
          type: "number"
          format: "double"
        serviceFee:
          type: "number"
          format: "double"
        occupancyTax:
          type: "number"
          format: "double"
        securityDeposit:
          type: "number"
          format: "double"
        totalAmount:
          type: "number"
          format: "double"
        minimumStayNights:
          type: "integer"
          format: "int32"
        isAvailable:
          type: "boolean"
        unavailableReason:
          type: "string"
          nullable: true
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/PriceBreakdownItem"
          nullable: true
      additionalProperties: false
      description: |-
        The authoritative price for a stay. Both the quote endpoint and the create endpoint return
        numbers produced by this record, so the receipt and the stored reservation always agree.
    ResetResponse:
      type: "object"
      properties:
        reset:
          type: "boolean"
        listings:
          type: "integer"
          format: "int32"
        reservations:
          type: "integer"
          format: "int32"
        reviews:
          type: "integer"
          format: "int32"
        favorites:
          type: "integer"
          format: "int32"
        timestamp:
          type: "string"
          format: "date-time"
      additionalProperties: false
    Review:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        listingId:
          type: "string"
          format: "uuid"
        authorId:
          type: "string"
          format: "uuid"
        authorName:
          type: "string"
          nullable: true
        authorAvatarUrl:
          type: "string"
          nullable: true
        rating:
          type: "integer"
          format: "int32"
        comment:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
      additionalProperties: false
      description: |-
        A guest review. `authorAvatarUrl` is kept for compatibility but the web client ignores it
        and renders initials instead, so an untrusted URL can never become an image request.
    ReviewsResponse:
      type: "object"
      properties:
        listingId:
          type: "string"
          format: "uuid"
        averageRating:
          type: "number"
          format: "double"
        totalReviews:
          type: "integer"
          format: "int32"
        page:
          type: "integer"
          format: "int32"
        pageSize:
          type: "integer"
          format: "int32"
        reviews:
          type: "array"
          items:
            $ref: "#/components/schemas/Review"
          nullable: true
      additionalProperties: false
    StageResponse:
      type: "object"
      properties:
        stage:
          type: "string"
          nullable: true
        environment:
          type: "string"
          nullable: true
        isDevelopment:
          type: "boolean"
        isProduction:
          type: "boolean"
        version:
          type: "string"
          nullable: true
        timestamp:
          type: "string"
          format: "date-time"
      additionalProperties: false
    SystemStatsResponse:
      type: "object"
      properties:
        totalListings:
          type: "integer"
          format: "int32"
        totalReservations:
          type: "integer"
          format: "int32"
        totalReviews:
          type: "integer"
          format: "int32"
        totalFavorites:
          type: "integer"
          format: "int32"
        systemVersion:
          type: "string"
          nullable: true
        serverTimeUtc:
          type: "string"
          format: "date-time"
        uptimeSeconds:
          type: "integer"
          format: "int32"
        totalPaidByCurrency:
          type: "object"
          additionalProperties:
            type: "number"
            format: "double"
          nullable: true
        upcomingReservations:
          type: "integer"
          format: "int32"
        averageNightlyRate:
          type: "number"
          format: "double"
      additionalProperties: false
    UpdateListingRequest:
      type: "object"
      properties:
        title:
          maxLength: 120
          minLength: 5
          type: "string"
          nullable: true
        description:
          maxLength: 2000
          minLength: 20
          type: "string"
          nullable: true
        imageUrl:
          maxLength: 300
          type: "string"
          nullable: true
        category:
          type: "string"
          nullable: true
        coordinates:
          $ref: "#/components/schemas/CoordinatePair"
        address:
          $ref: "#/components/schemas/Address"
        capacity:
          $ref: "#/components/schemas/CapacityBreakdown"
        amenities:
          type: "array"
          items:
            type: "string"
          nullable: true
        hostId:
          type: "string"
          format: "uuid"
          nullable: true
        pricing:
          $ref: "#/components/schemas/PricingMatrix"
        houseRules:
          $ref: "#/components/schemas/HouseRules"
        instantBookEnabled:
          type: "boolean"
          nullable: true
      additionalProperties: false
      description: "Partial update. Any property left null keeps its stored value."
    UpdateReservationStatusRequest:
      required:
        - "status"
      type: "object"
      properties:
        status:
          maxLength: 30
          minLength: 0
          type: "string"
        reason:
          maxLength: 240
          minLength: 0
          type: "string"
          nullable: true
      additionalProperties: false
tags:
  -
    name: "Favorites"
    description: |-
      Saved stays. The list is independent of the current search: it returns full listings ordered by
      title, and the toggle is atomic.
  -
    name: "Hosts"
    description: |-
      The host directory. Unlike the prototype, hosts are served from their own store, so the client no
      longer derives them from whatever the last search returned.
  -
